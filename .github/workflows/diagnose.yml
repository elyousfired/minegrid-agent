name: Diagnose on-chain games

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        game: [godl, ore]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -m minegrid_agent diagnose --game ${{ matrix.game }}
